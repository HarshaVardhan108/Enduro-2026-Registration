<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>

    <!-- Vibrant Tech Orange Flame Gradient -->
    <linearGradient id="enduroFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Subtle Cyan Edge / Reflection -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Neon Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#enduroFlame)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Enduro Isometric 3-Layer Tech Emblem (Hexagonal Steps) -->
  <g filter="url(#glow)">
    <!-- Top Cap (Diamond facet) -->
    <polygon points="32,10 49,20 32,30 15,20" fill="url(#enduroFlame)"/>
    
    <!-- Middle Tier Layer -->
    <polyline points="15,26 32,36 49,26" fill="none" stroke="url(#enduroFlame)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Tier Layer -->
    <polyline points="15,38 32,48 49,38" fill="none" stroke="url(#enduroFlame)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Tech Energy Core / Center "E" Spark -->
    <polygon points="32,23 37,26 32,29 27,26" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="49" r="2.2" fill="url(#cyanSpark)"/>
  </g>
</svg>
